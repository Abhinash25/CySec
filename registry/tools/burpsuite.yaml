  - os: "linux"
    arch: "amd64"
    support: "SUPPORTED"
    download_url: "https://portswigger-cdn.net/burp/releases/download?product=community&version=2024.7.4&type=jar"
  - os: "darwin"
    arch: "amd64"
    support: "SUPPORTED"
    download_url: "https://portswigger-cdn.net/burp/releases/download?product=community&version=2024.7.4&type=jar"
host_prerequisites:
