official_website: "https://www.tcpdump.org/"
installation_method: "SYSTEM_WRAPPER"
installer_adapter: "system_wrapper"
entry_command: "tcpdump"
interface_type: "cli"
profiles:
  - full
version: "system"
tool_status: "VALIDATED"
platforms:
  - os: "linux"
    arch: "amd64"
    support: "SUPPORTED"
  - os: "darwin"
    arch: "amd64"
    support: "SUPPORTED"
host_prerequisites:
  - name: "tcpdump"
    description: "Tcpdump system installation is required"
    command: "tcpdump --version"
    mandatory: true
