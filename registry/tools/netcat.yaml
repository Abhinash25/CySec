    arch: "amd64"
    support: "SUPPORTED"
  - os: "darwin"
    arch: "amd64"
    support: "SUPPORTED"
host_prerequisites:
  - name: "netcat"
    description: "Netcat (nc) system installation is required"
    command: "nc -h"
    mandatory: true
